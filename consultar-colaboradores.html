<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultar Colaboradores</title>
  <style>
    :root{
      --bg:#07152f;
      --panel:#0b1d3d;
      --border:#16325f;
      --text:#e5e7eb;
      --muted:#9fb1d1;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg, #07152f 0%, #091a38 100%);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }
    .wrap{max-width:1280px; margin:32px auto; padding:0 20px;}
    .topbar{
      display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
      flex-wrap:wrap; margin-bottom:20px;
    }
    h1{margin:0 0 8px; font-size:34px;}
    .subtitle{margin:0; color:var(--muted);}
    .nav-links{display:flex; gap:10px; flex-wrap:wrap;}
    .nav-links a{
      color:var(--text); text-decoration:none; border:1px solid var(--border);
      background:rgba(255,255,255,.03); padding:10px 14px; border-radius:12px;
    }
    .card{
      background:rgba(10,26,58,.96);
      border:1px solid var(--border);
      border-radius:20px;
      padding:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
      margin-bottom:20px;
    }
    .filters{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
      margin-bottom:16px;
    }
    label{
      display:block;
      font-size:14px;
      color:var(--muted);
      margin-bottom:8px;
      font-weight:700;
    }
    input, select, button{
      width:100%;
      padding:12px 14px;
      background:#0a1732;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:12px;
      font:inherit;
    }
    button{cursor:pointer; background:#13294f; font-weight:700;}
    .table-wrap{
      overflow:auto;
      border:1px solid var(--border);
      border-radius:16px;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:1200px;
      background:#09152b;
    }
    th, td{
      padding:12px;
      border-bottom:1px solid #14305a;
      text-align:left;
      vertical-align:top;
    }
    th{
      color:var(--muted);
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .meta{color:var(--muted); font-size:13px; margin-top:10px;}
    @media (max-width: 980px){
      .filters{grid-template-columns:1fr}
      h1{font-size:28px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Consultar Base de Colaboradores</h1>
        <p class="subtitle">Filtre a base histórica por data, coordenação, supervisão e colaborador.</p>
      </div>
      <div class="nav-links">
        <a href="./dashboard">Dashboard</a>
        <a href="./importar-colaboradores.html">Importar</a>
        <a href="./historico-colaboradores.html">Histórico</a>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <div>
          <label for="fData">Data referência</label>
          <input type="date" id="fData" />
        </div>
        <div>
          <label for="fCoordenacao">Coordenação</label>
          <input type="text" id="fCoordenacao" placeholder="Ex.: Operações" />
        </div>
        <div>
          <label for="fSupervisao">Supervisão</label>
          <input type="text" id="fSupervisao" placeholder="Ex.: Supervisão Sul" />
        </div>
        <div>
          <label for="fNome">Nome</label>
          <input type="text" id="fNome" placeholder="Buscar nome" />
        </div>
        <div>
          <label for="fSituacao">Situação</label>
          <input type="text" id="fSituacao" placeholder="Ex.: Ativo" />
        </div>
      </div>

      <div class="filters" style="grid-template-columns:repeat(4,1fr);">
        <div>
          <label for="fEmpresa">Empresa</label>
          <input type="text" id="fEmpresa" placeholder="Empresa" />
        </div>
        <div>
          <label for="fTipo">Tipo</label>
          <input type="text" id="fTipo" placeholder="Tipo" />
        </div>
        <div>
          <label for="fCpf">CPF</label>
          <input type="text" id="fCpf" placeholder="CPF" />
        </div>
        <div style="display:flex; align-items:end;">
          <button id="btnPesquisar">Pesquisar</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>CPF</th>
              <th>Nome</th>
              <th>Situação</th>
              <th>Empresa</th>
              <th>Coordenação</th>
              <th>Supervisão</th>
              <th>Cargo</th>
              <th>Cidade</th>
              <th>Tipo</th>
              <th>E-mail empresa</th>
              <th>Whatsapp</th>
            </tr>
          </thead>
          <tbody id="tbodyColaboradores"></tbody>
        </table>
      </div>

      <div class="meta" id="metaConsulta">Aguardando pesquisa.</div>
    </div>
  </div>

  <script type="module" src="./assets/js/consultarColaboradores.js"></script>
</body>
</html>
