<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#052e1b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gestor G1000" />
  <title>App Gestor | Grão 1000</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/pwa-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png" />
  <link rel="stylesheet" href="./assets/css/gestor-app.css?v=20260831-email-layout" />
  <link rel="stylesheet" href="./assets/css/gestor-email-tabs-topo.css?v=20260902-1" />
  <link rel="stylesheet" href="./assets/css/gestor-app-mobile-ux.css" />
  <link rel="stylesheet" href="./assets/css/gestor-app-mobile-render-fix.css?v=20260805-1" />
  <style>
    body #app.gestor-app #appMain .db-row-2{
      display:grid!important;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
      gap:7px!important;
    }
    body #app.gestor-app #appMain .db-row-2>.db-os-card,
    body #app.gestor-app #appMain .db-row-2>.db-patri-card{
      min-width:0!important;
      width:auto!important;
    }
  </style>
</head>
<body>
  <div id="app" class="gestor-app is-loading">
    <div class="app-loader">
      <img src="./logo-grao1000.svg" alt="Grão 1000" />
      <strong>Carregando App Gestor...</strong>
      <span>Preparando módulos do gestor.</span>
    </div>
  </div>
  <script>
    // Rede de segurança que NÃO depende de nenhum arquivo .js externo carregar.
    // Se o service worker/rede falhar bem no fetch do gestor-app.js (comum em
    // sinal fraco de celular), o módulo nunca executa e o app fica preso na
    // tela estática de "Carregando..." pra sempre, sem nenhum jeito de sair —
    // porque o botão de recuperação normal também vive dentro desse mesmo
    // arquivo que falhou. Este script roda inline, então funciona mesmo assim.
    (function () {
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || !app.classList.contains('is-loading')) return;
        app.innerHTML =
          '<div class="app-loader">' +
          '<img src="./logo-grao1000.svg" alt="Grão 1000" />' +
          '<strong>O app não conseguiu carregar.</strong>' +
          '<span>Pode ser sinal fraco ou uma versão antiga guardada no celular.</span>' +
          '<button type="button" id="staticHardRefreshBtn" style="margin-top:12px;padding:12px 20px;border-radius:10px;border:none;background:#1fae63;color:#fff;font-weight:600;font-size:15px;">Atualizar app</button>' +
          '</div>';
        var btn = document.getElementById('staticHardRefreshBtn');
        if (!btn) return;
        btn.addEventListener('click', function () {
          btn.disabled = true;
          btn.textContent = 'Atualizando...';
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}));
          }
          if ('caches' in window) {
            tasks.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}));
          }
          Promise.all(tasks).finally(function () { location.reload(); });
        });
      }, 14000);
    })();
  </script>
  <script type="module" src="./assets/js/gestor-app-dashboard-live-fix.js?v=20260909-patrimonio-null-atrasado"></script>
  <script type="module" src="./assets/js/gestor-app.js?v=20260922-boot-watchdog2"></script>
  <script type="module" src="./assets/js/gestor-app-supervisao-fix.js?v=20260702-coordfix1"></script>
  <script type="module" src="./assets/js/gestor-app-mobile-ux.js?v=20260831-email-layout"></script>
  <script type="module" src="./assets/js/gestor-app-full-modules-fix.js?v=20260813-v1"></script>
  <script type="module" src="./assets/js/gestor-app-mobile-home-fix.js?v=20260702-coordfix1"></script>
</body>
</html>
