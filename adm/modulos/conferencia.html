<style>
/* ===== Conferência (Histórico) — UI padrão painel ===== */
.conf-root{ padding:14px; }
.conf-root .mono{ opacity:.9; margin-top:6px; }

.conf-actions-top{ display:flex; gap:10px; justify-content:flex-end; align-items:center; }
.conf-btn{
  height:38px;
  padding:0 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.14);
  background:#0f172a;
  color:#e5e7eb;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
}
.conf-btn:hover{
  border-color:#166534;
  box-shadow:0 0 0 2px rgba(22,101,52,.22);
}
.conf-btn.primary{
  background:#166534;
  border-color:#166534;
  color:#fff;
}
.conf-btn.primary:hover{ filter:brightness(1.08); }

/* Lista com rolagem (página não rola, só a lista) */
.conf-scroll{
  max-height: calc(100vh - 320px);
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  overscroll-behavior:contain;
  border-radius:14px;
}
@media (max-width: 980px){
  .conf-scroll{ max-height: calc(100vh - 360px); }
}

/* Cabeçalho fixo da tabela/lista */
.conf-head{
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(15,23,42,.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(255,255,255,.10);
}

/* Grid da tabela */
.conf-head, .conf-row{
  display:grid;
  grid-template-columns:  120px minmax(0,1.6fr) 90px 60px 70px 60px 95px 95px 95px 105px minmax(0,1.1fr);
  gap:10px;
  align-items:center;
  padding:10px 12px;
}
.conf-head{
  font-size:12px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color: rgba(229,231,235,.85);
}
.conf-row{
  background: rgba(2,6,23,.35);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  margin:10px 0;
}
.conf-row:hover{ border-color: rgba(22,101,52,.45); }

.conf-head > div, .conf-row > div{ min-width:0; }

.conf-colab{
  display:flex; flex-direction:column; gap:3px;
}
.conf-colab b{ font-size:14px; }
.conf-colab .sub{
  font-size:12px;
  color: rgba(229,231,235,.78);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.conf-pill{
  font-size:11px;
  padding:2px 8px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(15,23,42,.65);
}
.conf-pill.ok{ border-color: rgba(34,197,94,.35); color: rgba(187,247,208,.95); }
.conf-pill.bad{ border-color: rgba(248,113,113,.35); color: rgba(254,202,202,.95); }
.dash{ opacity:.65; }

/* Agrupado: sem overflow interno */
.conf-group{ overflow:hidden; }

/* Mantém alinhamento numérico */
.conf-num{ text-align:right; }

/* Evita barras internas (especialmente no modo Agrupar) */
.conf-table-wrap, .conf-table-wrap *{
  scrollbar-width: none; /* Firefox */
}
.conf-table-wrap::-webkit-scrollbar,
.conf-table-wrap *::-webkit-scrollbar{
  width:0 !important;
  height:0 !important;
}

</style>

  <div class="row" style="justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap">
    <div>
      <h2 style="margin:0">Histórico de despesas</h2>
      <div class="muted" style="margin-top:4px">Filtre por período e pesquise por nome/coordenação. A página não rola — só a lista.</div>
    </div>
    <div class="conf-actions-top">
      <button id="conf_back" class="conf-btn" type="button">← Voltar</button>
    </div>
  </div>

  <!-- Removido: linha "Conferência — ADM" (redundante, já existe o título do painel acima) -->
  <div class="mono">Programação do dia • Histórico de despesas</div>

  <div class="row" style="margin-top:10px">
    <div class="field">

<script>
  // ========= Máscara dd/MM/aaaa =========
  function applyDMYMask(input){
    if (!input) return;

    input.addEventListener("input", () => {
      let v = (input.value || "").replace(/\D/g, "").slice(0,8);
      if (v.length >= 5) input.value = v.slice(0,2) + "/" + v.slice(2,4) + "/" + v.slice(4);
      else if (v.length >= 3) input.value = v.slice(0,2) + "/" + v.slice(2);
      else input.value = v;
    });

    // valida leve no blur (evita 99% de erros de digitação)
    input.addEventListener("blur", () => {
      const d = parseDMY_(input.value);
      if (!d) return; // deixa como está
      input.value = fmtDMY_(d);
    });
  }

  function parseDMY_(s){
    const m = String(s||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return null;
    const dd = +m[1], mm = +m[2], yy = +m[3];
    const d = new Date(yy, mm-1, dd);
    if (d.getFullYear() !== yy || d.getMonth() !== (mm-1) || d.getDate() !== dd) return null;
    d.setHours(0,0,0,0);
    return d;
  }

  function fmtDMY_(d){
    const dd = ("0"+d.getDate()).slice(-2);
    const mm = ("0"+(d.getMonth()+1)).slice(-2);
    return dd + "/" + mm + "/" + d.getFullYear();
  }

  function addDays_(d, n){
    const x = new Date(d.getTime());
    x.setDate(x.getDate() + n);
    x.setHours(0,0,0,0);
    return x;
  }

  function fmtMoney_(v){
    const n = +v || 0;
    if (!(n > 0)) return `<span class="dash">-</span>`;
    return "R$ " + n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // ========= Tabela (estrutura que você pediu) =========
  
  function escapeHtml_(s){
    return String(s ?? "").replace(/[&<>"']/g, (c)=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

function norm_(s){
    return String(s||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^0-9A-Za-z ]/g, " ")
      .replace(/\s+/g, " ")
      .toUpperCase()
      .trim();
  }

  function fmtMoney_(v){
    const n = +v || 0;
    if (!(n > 0)) return `<span class="dash">-</span>`;
    return "R$ " + n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtSimNao_(v){
    return (+v || 0) > 0 ? "Sim" : `<span class="dash">-</span>`;
  }

  function fmtProducao_(r){
    const p = (r && (r.Producao ?? r.ProducaoTons)) ?? "";
    if (typeof p === "string") return p || "—";
    const n = +p || 0;
    return n > 0 ? n.toFixed(2).replace(".", ",") : "—";
  }


/** Produção: converte com MoneyShield e bloqueia valores absurdos */
function prodNum_(v){
  try{
    const n = (window.MoneyShield && MoneyShield.num) ? MoneyShield.num(v) : (+v || 0);
    if (!isFinite(n)) return 0;
    // guardrail: produção diária/por filtro não pode virar número “astronômico”
    // (normalmente erro de parse/coluna). Ajuste o limite se necessário.
    if (Math.abs(n) > 10000000) return 0; // 10 milhões de tons é irreal aqui
    return n;
  }catch(_){
    return 0;
  }
}

  // ===== Conferente (derivado) =====
  const CONF_MAP_COORD_CONFERENTE = {
    "RIO GRANDE DO SUL": "GRAZIELA",
    "CASCAVEL": "GRAZIELA",
    "SÃO PAULO": "ANDREA",
    "MATO GROSSO MT4": "TAINA",
    "BAHIA": "MARIA",
    "GOIAS": "MARIA",
    "MATO GROSSO MT1": "TAINA",
    "MATO GROSSO MT2": "TAINA",
    "LONDRINA": "GRAZIELA",
    "MINAS GERAIS": "TAINA",
    "MARINGA E TERMINAIS": "ANDREA",
    "GERAL": "RENATA",
    "MATOPIPA": "MARIA",
    "MATO GROSSO MT3 - QUERENCIA": "ANDREA",
    "PONTA GROSSA": "ANDREA",
    "MATO GROSSO DO SUL": "ANDREA",
    "MATO GROSSO MT3 - CONFRESA": "TAINA"
  };

  const CONF_KEYS_SORTED_ = Object.keys(CONF_MAP_COORD_CONFERENTE)
    .sort((a,b)=> b.length - a.length);

  function inferConferente_(r){
    const raw = String((r && (r.Conferente || r.Coordenação || r.Coordenacao || r.Supervisão || r.Supervisao)) || "").trim();
    if (!raw) return "";
    const nRaw = norm_(raw);
    for (const k of CONF_KEYS_SORTED_){
      if (nRaw.includes(norm_(k))) return CONF_MAP_COORD_CONFERENTE[k] || "";
    }
    // fallback: tenta pegar antes do " - "
    const part = raw.split(" - ")[0].trim();
    const nPart = norm_(part);
    for (const k of CONF_KEYS_SORTED_){
      if (nPart === norm_(k)) return CONF_MAP_COORD_CONFERENTE[k] || "";
    }
    return "";
  }


  function uniqueSorted_(arr){
    return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=> String(a).localeCompare(String(b),"pt-BR"));
  }

  // ========= Render =========
  let __histAll = []; // dados do período (sem filtros locais)
  function getFiltrosUI_(){
    return {
      nome: (document.getElementById("adm_fNome")?.value || "").trim(),
      supervisao: (document.getElementById("adm_fSup")?.value || "").trim(),
      conferente: (document.getElementById("adm_fConf")?.value || "").trim(),
      viewMode: (document.getElementById("adm_viewMode")?.value || "lista")
    };
  }

  function applyLocalFilters_(rows){
    const f = getFiltrosUI_();
    const nNome = norm_(f.nome);
    const nSup  = norm_(f.supervisao);
    const nConf = norm_(f.conferente);

    return (rows||[]).filter(r=>{
      if (nNome && !norm_(r.Colaborador).includes(nNome)) return false;
      if (nSup  && !norm_(r.Supervisão).includes(nSup)) return false;
      if (nConf && !norm_(r.Conferente).includes(nConf)) return false;
      return true;
    });
  }

  function sortRows_(rows){
    return (rows||[]).slice().sort((a,b) => {
      const da = parseDMY_(a.DataReferencia);
      const db = parseDMY_(b.DataReferencia);
      const ta = da ? da.getTime() : 0;
      const tb = db ? db.getTime() : 0;
      if (ta !== tb) return ta - tb;
      return String(a.Colaborador||"").localeCompare(String(b.Colaborador||""), "pt-BR");
    });
  }

  function renderTabelaHistorico(containerId, rows){
    const el = document.getElementById(containerId);
    if (!el) return;

    const viewMode = (document.getElementById("adm_viewMode")?.value || "lista");

    if (!rows || !rows.length){
      el.innerHTML = `<div class="muted" style="padding:10px 2px;">Sem registros no período.</div>`;
      return;
    }

    const sorted = sortRows_(rows);

    // ===== view: lista (cards) =====
    if (viewMode === "lista"){
      let html = `
        <div class="conf-head">
          <div>Data</div>
          <div>Colaborador</div>
          <div class="conf-num">Prod.</div>
          <div style="text-align:center">Café</div>
          <div style="text-align:center">Almoço</div>
          <div style="text-align:center">Janta</div>
          <div class="conf-num">Recarga</div>
          <div class="conf-num">Lavagem</div>
          <div class="conf-num">Passagem</div>
          <div class="conf-num">Total (R$)</div>
          <div>Extras</div>
        </div>
      `;

      for (const r of sorted){
        const status = String(r.Disponibilidade_Status || "").trim();
        const st = norm_(status);
        const badgeClass = (st === "DISPONIVEL") ? "ok" : "bad";

        const vRec = (Number(r.Extras_Recarga_Valor)||0);
        const vPas = (Number(r.Extras_Passagem_Valor)||0);
        const vLav = (Number(r.Extras_Lavagem_Valor)||0);
        const extras = vRec + vPas + vLav;

        const extrasObsRaw = (r.Extras_Texto ?? r.Extras_Observacoes ?? r.Extras_Outros ?? r.Extras ?? "").toString().trim();
        const extrasTxt = extrasObsRaw ? escapeHtml_(extrasObsRaw) : `<span class="dash">-</span>`;


        html += `
          <div class="conf-row">
            <div class="mono">${r.DataReferencia || ""}</div>

            <div class="conf-colab">
              <b>${escapeHtml_(r.Colaborador || "—")}</b>
              <div class="sub">
                <span>${escapeHtml_(r.Supervisão || "—")}</span>
                <span class="conf-pill ${badgeClass}">${escapeHtml_(status || "-")}</span>
              </div>
            </div>

            <div class="mono conf-num">${fmtProducao_(r)}</div>
            <div style="text-align:center">${fmtSimNao_(r.Cafe_Valor)}</div>
            <div style="text-align:center">${fmtSimNao_(r.Almoco_Valor)}</div>
            <div style="text-align:center">${fmtSimNao_(r.Janta_Valor)}</div>

            <div class="mono conf-num">${vRec ? fmtMoney_(vRec) : `<span class="dash">-</span>`}</div>
            <div class="mono conf-num">${vLav ? fmtMoney_(vLav) : `<span class="dash">-</span>`}</div>
            <div class="mono conf-num">${vPas ? fmtMoney_(vPas) : `<span class="dash">-</span>`}</div>
            <div class="mono conf-num">${extras ? fmtMoney_(extras) : `<span class="dash">-</span>`}</div>
            <div class="muted">${extrasTxt}</div>
          </div>
        `;
      }

      el.innerHTML = html;
      return;
    }

    // ===== view: grupo (separador por colaborador) =====
    const byColab = new Map();
    for (const r of sorted){
      const key = String(r.Colaborador || '—').trim() || '—';
      if (!byColab.has(key)) byColab.set(key, []);
      byColab.get(key).push(r);
    }

    let html = `
      <div class="conf-head">
        <div>Data</div>
        <div>Colaborador</div>
        <div class="conf-num">Prod.</div>
        <div style="text-align:center">Café</div>
        <div style="text-align:center">Almoço</div>
        <div style="text-align:center">Janta</div>
        <div class="conf-num">Recarga</div>
        <div class="conf-num">Lavagem</div>
        <div class="conf-num">Passagem</div>
        <div class="conf-num">Total (R$)</div>
        <div>Extras</div>
      </div>
    `;

    const colabs = Array.from(byColab.keys()).sort((a,b)=>a.localeCompare(b, 'pt-BR'));
    for (const colab of colabs){
      const itens = (byColab.get(colab) || []).slice();
      // mais recente primeiro dentro do grupo
      itens.sort((a,b)=>{
        const da = parseDMY_(a.DataReferencia);
        const db = parseDMY_(b.DataReferencia);
        return (db?db.getTime():0) - (da?da.getTime():0);
      });

      html += `
        <div class="conf-group" style="
          margin:12px 0 6px;
          padding:8px 12px;
          border-radius:12px;
          border:1px solid rgba(255,255,255,.10);
          background: rgba(15,23,42,.55);
          font-weight:800;
          display:flex;
          justify-content:space-between;
          gap:10px;
          align-items:center;
        ">
          <span>${escapeHtml_(colab)}</span>
          <span class="muted" style="font-weight:700">${itens.length} registro(s)</span>
        </div>
      `;

      for (const r of itens){
        const status = String(r.Disponibilidade_Status || "").trim();
        const st = norm_(status);
        const badgeClass = (st === "DISPONIVEL") ? "ok" : "bad";

        const vRec = (Number(r.Extras_Recarga_Valor)||0);
        const vPas = (Number(r.Extras_Passagem_Valor)||0);
        const vLav = (Number(r.Extras_Lavagem_Valor)||0);
        const extras = vRec + vPas + vLav;

        const extrasObsRaw = (r.Extras_Texto ?? r.Extras_Observacoes ?? r.Extras_Outros ?? r.Extras ?? "").toString().trim();
        const extrasTxt = extrasObsRaw ? escapeHtml_(extrasObsRaw) : `<span class="dash">-</span>`;


        html += `
          <div class="conf-row">
            <div class="mono">${r.DataReferencia || ""}</div>

            <div class="conf-colab">
              <b>${escapeHtml_(r.Colaborador || "—")}</b>
              <div class="sub">
                <span>${escapeHtml_(r.Supervisão || "—")}</span>
                <span class="conf-pill ${badgeClass}">${escapeHtml_(status || "-")}</span>
              </div>
            </div>

            <div class="mono conf-num">${fmtProducao_(r)}</div>
            <div style="text-align:center">${fmtSimNao_(r.Cafe_Valor)}</div>
            <div style="text-align:center">${fmtSimNao_(r.Almoco_Valor)}</div>
            <div style="text-align:center">${fmtSimNao_(r.Janta_Valor)}</div>

            <div class="mono conf-num">${vRec ? fmtMoney_(vRec) : `<span class="dash">-</span>`}</div>
            <div class="mono conf-num">${vLav ? fmtMoney_(vLav) : `<span class="dash">-</span>`}</div>
            <div class="mono conf-num">${vPas ? fmtMoney_(vPas) : `<span class="dash">-</span>`}</div>
            <div class="mono conf-num">${extras ? fmtMoney_(extras) : `<span class="dash">-</span>`}</div>
            <div class="muted">${extrasTxt}</div>
          </div>
        `;
      }
    }

    el.innerHTML = html;

  }

  async function admBuscarHistorico_(){
    const metaEl = document.getElementById("adm_meta");
    const dtIni = (document.getElementById("adm_dtIni")?.value || "").trim();
    const dtFim = (document.getElementById("adm_dtFim")?.value || "").trim();

    if (!parseDMY_(dtIni) || !parseDMY_(dtFim)){
      metaEl.textContent = "Erro: informe datas válidas (dd/MM/aaaa).";
      __histAll = [];
      renderTabelaHistorico("adm_resultadoHistorico", []);
      return;
    }

    metaEl.textContent = "Carregando histórico...";

    const res = await window.admBackendCall({
      module: "adm",
      action: "adm_getHistoricoPeriodoDespesas",
      dtIni, dtFim,
      filtros: {} // filtros locais ficam no front (busca mais rápida ao digitar)
    });

    __histAll = Array.isArray(res?.rows) ? res.rows : [];

    // garante Conferente (se vier vazio do GAS, deriva pela coord/supervisão)
    __histAll.forEach(r=>{
      if (!r) return;
      const c = String(r.Conferente || "").trim();
      if (!c) r.Conferente = inferConferente_(r);
    });


    // popula conferentes
    const confSel = document.getElementById("adm_fConf");
    if (confSel){
      const atual = confSel.value || "";
      const confs = uniqueSorted_(__histAll.map(r => String(r.Conferente || "").trim()).filter(Boolean));
      confSel.innerHTML = `<option value="">(todas)</option>` + confs.map(c => `<option value="${String(c).replace(/"/g,"&quot;")}">${c}</option>`).join("");
      confSel.value = atual; // tenta manter
    }

    // meta (total + produção total)
    const filtrados = applyLocalFilters_(__histAll);
    const total = filtrados.length;
    const prodTotal = filtrados.reduce((acc,r)=> acc + prodNum_(r.producao ?? r.ProducaoTons ?? r.Producao), 0);
    const prodTxt = prodTotal > 0 ? prodTotal.toFixed(2).replace(".", ",") : "—";

    metaEl.textContent = `Registros: ${total} • Produção total: ${prodTxt}`;

    renderTabelaHistorico("adm_resultadoHistorico", filtrados);
  }
  (function boot_(){
    try { document.body.classList.add('conf-mode'); } catch(e) {}

    const backBtn = document.getElementById('conf_back');
    if (backBtn){
      backBtn.addEventListener('click', () => {
        try { document.body.classList.remove('conf-mode'); } catch(e) {}
        try {
          if (window.ADM && typeof window.ADM.showHome === 'function') {
            window.ADM.showHome();
          } else if (window.ADM && typeof window.ADM.backToHome === 'function') {
            window.ADM.backToHome();
          } else if (history.length > 1) {
            history.back();
          }
        } catch(e) {}
      });
    }
    const iIni = document.getElementById("adm_dtIni");
    const iFim = document.getElementById("adm_dtFim");
    applyDMYMask(iIni);
    applyDMYMask(iFim);

    // 🔁 Auto buscar ao editar período (mantém barras dd/MM/aaaa)
    function hookDateAuto_(inp){
      if (!inp) return;
      inp.addEventListener("input", () => {
        const v = (inp.value || "").trim();
        // quando completar dd/MM/aaaa dispara
        if (v.length === 10 && parseDMY_(v)) scheduleFetch_();
      });
      inp.addEventListener("blur", () => {
        const v = (inp.value || "").trim();
        if (v.length === 10 && parseDMY_(v)) scheduleFetch_();
      });
    }
    hookDateAuto_(iIni);
    hookDateAuto_(iFim);

    // ✅ datas default: últimos 7 dias
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    if (iFim && !iFim.value) iFim.value = fmtDMY_(hoje);
    if (iIni && !iIni.value) iIni.value = fmtDMY_(addDays_(hoje, -7));

    const btn = document.getElementById("adm_btnHistorico");
    const rerender = () => {
      const metaEl = document.getElementById("adm_meta");
      const filtrados = applyLocalFilters_(__histAll);
      const total = filtrados.length;
      const prodTotal = filtrados.reduce((acc,r)=> acc + prodNum_(r.producao ?? r.ProducaoTons ?? r.Producao), 0);
      const prodTxt = prodTotal > 0 ? prodTotal.toFixed(2).replace(".", ",") : "—";
      if (metaEl) metaEl.textContent = `Registros: ${total} • Produção total: ${prodTxt}`;
      renderTabelaHistorico("adm_resultadoHistorico", filtrados);
    };

    // ⏱️ Auto atualizar ao mudar período (debounce)
    let __fetchT = null;
    function scheduleFetch_(){
      clearTimeout(__fetchT);
      __fetchT = setTimeout(() => {
        admBuscarHistorico_().catch(err => {
          console.error(err);
          const metaEl = document.getElementById("adm_meta");
          if (metaEl) metaEl.textContent = "Erro: " + (err?.message || err);
        });
      }, 450);
    }

    btn?.addEventListener("click", () => admBuscarHistorico_().catch(err => {
      console.error(err);
      const metaEl = document.getElementById("adm_meta");
      metaEl.textContent = "Erro: " + (err?.message || err);
      __histAll = [];
      renderTabelaHistorico("adm_resultadoHistorico", []);
    }));

    // 🔎 filtros em tempo real (sem precisar clicar)
    document.getElementById("adm_fNome")?.addEventListener("input", () => rerender());
    document.getElementById("adm_fSup")?.addEventListener("input", () => rerender());
    document.getElementById("adm_fConf")?.addEventListener("change", () => rerender());
    document.getElementById("adm_viewMode")?.addEventListener("change", () => rerender());

    // ✅ ao abrir a tela: já carrega
    admBuscarHistorico_().catch(err => {
      console.error(err);
      const metaEl = document.getElementById("adm_meta");
      if (metaEl) metaEl.textContent = "Erro: " + (err?.message || err);
    });
  })();
</script>
