<!-- ================================
  MÓDULO CONFERÊNCIA — ADM
  Programação do dia + Histórico
================================ -->

<div class="confmod">
  <div class="confmod__head">
    <!-- Removido: título redundante do módulo (já existe no cabeçalho do painel) -->

    <div class="confmod__tabs">
      <button class="confmod__tab active" id="tabProg">Programação do dia</button>
      <button class="confmod__tab" id="tabHist">Histórico de despesas</button>
    </div>
  </div>

  <!-- ================= PROGRAMAÇÃO DO DIA ================= -->
  <section id="paneProg">
    <div class="confmod__row">
      <input type="date" id="progData">
      <input type="text" id="progNome" placeholder="Colaborador">
      <input type="text" id="progSup" placeholder="Supervisão">

      <select id="progConf">
        <option value="">Conferente (todas)</option>
        <option>Andrea</option>
        <option>Maria</option>
        <option>Grazi</option>
        <option>Renata</option>
        <option>Taina</option>
      </select>

      <button id="btnProgBuscar">Buscar</button>
    </div>

    <div id="progStatus"></div>
    <div id="progTabela"></div>
  </section>

  <!-- ================= HISTÓRICO ================= -->
  <section id="paneHist" style="display:none">
    <div class="confmod__row">
      <input type="date" id="histDe">
      <input type="date" id="histAte">
      <input type="text" id="histNome" placeholder="Colaborador">

      <button id="btnHistBuscar">Buscar</button>
    </div>

    <div id="histStatus"></div>
    <div id="histTabela"></div>
  </section>
</div>

<style>
.confmod{padding:16px}
.confmod__head{display:flex;justify-content:space-between;gap:12px}
.confmod__tabs{display:flex;gap:8px}
.confmod__tab{padding:8px 12px;cursor:pointer}
.confmod__tab.active{background:#1f8f5f;color:#fff}
.confmod__row{display:flex;gap:8px;margin:12px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd}
.okbadge{cursor:pointer;font-weight:bold}
.ok{color:green}
.pend{color:#999}
</style>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  function getToken(){
    // 1) AUTH (se existir)
    try{
      const t1 = window.AUTH?.getAuth?.()?.token;
      if (t1) return String(t1).trim();
    }catch(e){}
    // 2) fallback storage (compat com adm.js)
    const t2 = (localStorage.getItem("adm_token") || sessionStorage.getItem("adm_token") || "").trim();
    return t2;
  }

  function isoToDMY(i){
    if(!i) return "";
    const [y,m,d] = String(i).split("-");
    if(!y || !m || !d) return "";
    return `${d}/${m}/${y}`;
  }

  function setStatus(el, msg){
    el.textContent = msg || "";
  }

  function toggleOKLocal(key){
    const k = "ok_" + key;
    const ok = localStorage.getItem(k) === "1";
    localStorage.setItem(k, ok ? "0" : "1");
  }

  function renderTabela(el, itens, withOK){
    if(!Array.isArray(itens) || itens.length === 0){
      el.innerHTML = "Sem registros";
      return;
    }

    let html = "<table><tr>";
    if(withOK) html += "<th>OK</th>";
    html += "<th>Data</th><th>Colaborador</th><th>Despesas</th></tr>";

    itens.forEach((it, idx) => {
      const key = it?.key || `${it?.data || ""}|${it?.colaborador || ""}|${idx}`;
      html += "<tr>";

      if(withOK){
        const k = "ok_" + key;
        const ok = localStorage.getItem(k) === "1";
        html += `<td>
          <span class="okbadge ${ok ? "ok" : "pend"}" data-okkey="${key}">
            ${ok ? "OK" : "Pendente"}
          </span>
        </td>`;
      }

      html += `<td>${it?.data || ""}</td>
               <td>${it?.colaborador || ""}</td>
               <td>${it?.despesas || ""}</td></tr>`;
    });

    html += "</table>";
    el.innerHTML = html;

    // eventos OK (sem reload)
    if(withOK){
      el.querySelectorAll("[data-okkey]").forEach((node) => {
        node.addEventListener("click", () => {
          toggleOKLocal(node.getAttribute("data-okkey"));
          // re-render rápido atualizando apenas o badge
          const k = "ok_" + node.getAttribute("data-okkey");
          const ok = localStorage.getItem(k) === "1";
          node.classList.toggle("ok", ok);
          node.classList.toggle("pend", !ok);
          node.textContent = ok ? "OK" : "Pendente";
        });
      });
    }
  }

  async function callBackend(payload){
    if(typeof window.admBackendCall !== "function"){
      throw new Error("admBackendCall não encontrado. Verifique se adm.js foi carregado.");
    }
    return window.admBackendCall(payload);
  }

  async function carregarProgramacao(){
    const statusEl = $("progStatus");
    const tabelaEl = $("progTabela");

    const token = getToken();
    if(!token){
      setStatus(statusEl, "Sessão inválida. Clique em Sair e entre novamente.");
      tabelaEl.innerHTML = "";
      return;
    }

    const dataRef = isoToDMY($("progData").value);
    if(!dataRef){
      setStatus(statusEl, "Selecione a data.");
      tabelaEl.innerHTML = "";
      return;
    }

    setStatus(statusEl, "Carregando...");

    const r = await callBackend({
      module: "adm",
      action: "adm_listProgramacaoDia",
      token,
      dataRef,
      filtros: {
        nome: $("progNome").value || "",
        supervisao: $("progSup").value || "",
        conferente: $("progConf").value || ""
      }
    });

    setStatus(statusEl, "");
    renderTabela(tabelaEl, r.itens || [], true);
  }

  async function carregarHistorico(){
    const statusEl = $("histStatus");
    const tabelaEl = $("histTabela");

    const token = getToken();
    if(!token){
      setStatus(statusEl, "Sessão inválida. Clique em Sair e entre novamente.");
      tabelaEl.innerHTML = "";
      return;
    }

    const dtIni = isoToDMY($("histDe").value);
    const dtFim = isoToDMY($("histAte").value);

    if(!dtIni || !dtFim){
      setStatus(statusEl, "Selecione De e Até.");
      tabelaEl.innerHTML = "";
      return;
    }

    setStatus(statusEl, "Carregando...");

    const r = await callBackend({
      module: "adm",
      action: "adm_getHistoricoPeriodoDespesas",
      token,
      dtIni,
      dtFim,
      filtros: { nome: $("histNome").value || "" }
    });

    setStatus(statusEl, "");
    renderTabela(tabelaEl, r.itens || [], false);
  }

  $("btnProgBuscar").onclick = () => carregarProgramacao().catch((e)=>{
    console.error(e);
    setStatus($("progStatus"), String(e?.message || e));
  });

  $("btnHistBuscar").onclick = () => carregarHistorico().catch((e)=>{
    console.error(e);
    setStatus($("histStatus"), String(e?.message || e));
  });

  $("tabProg").onclick = () => {
    paneProg.style.display = "block";
    paneHist.style.display = "none";
    tabProg.classList.add("active");
    tabHist.classList.remove("active");
  };

  $("tabHist").onclick = () => {
    paneProg.style.display = "none";
    paneHist.style.display = "block";
    tabHist.classList.add("active");
    tabProg.classList.remove("active");
  };

  // defaults
  const hoje = new Date().toISOString().slice(0,10);
  $("progData").value = hoje;
  $("histAte").value = hoje;
  $("histDe").value = hoje;
})();
</script>
