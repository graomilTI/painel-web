<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Efetivos sem Produção</title>
  <style>
    :root{--bg:#07152f;--panel:#0b1d3d;--border:#16325f;--text:#e5e7eb;--muted:#9fb1d1;--green:#166534;--green2:#15803d}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#07152f 0%,#091a38 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{max-width:1320px;margin:32px auto;padding:0 20px}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    h1{margin:0 0 8px 0;font-size:34px}.subtitle{margin:0;color:var(--muted)}
    .nav-links{display:flex;gap:10px;flex-wrap:wrap}
    .nav-links a{color:var(--text);text-decoration:none;border:1px solid var(--border);background:rgba(255,255,255,.03);padding:10px 14px;border-radius:12px}
    .card{background:rgba(10,26,58,.96);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.18);margin-bottom:20px}
    .filters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
    label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px;font-weight:700}
    input,select,button{width:100%;padding:12px 14px;background:#0a1732;color:var(--text);border:1px solid var(--border);border-radius:12px;font:inherit}
    button{cursor:pointer;background:#13294f;font-weight:700}
    .btn-primary{background:linear-gradient(180deg,var(--green2),var(--green));border:0}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
    .actions button{width:auto;min-width:220px}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:16px}
    table{width:100%;border-collapse:collapse;min-width:1000px;background:#09152b}
    th,td{padding:12px;border-bottom:1px solid #14305a;text-align:left;vertical-align:top}
    th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
    .meta{color:var(--muted);font-size:13px;margin-top:10px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
    .mini{background:#09152b;border:1px solid var(--border);border-radius:16px;padding:16px}
    .mini .label{color:var(--muted);font-size:13px;margin-bottom:8px}
    .mini .value{font-size:24px;font-weight:700}
    .hidden{display:none}
    @media (max-width:980px){.filters,.summary{grid-template-columns:1fr}h1{font-size:28px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Efetivos sem Produção</h1>
        <p class="subtitle">Cruze a base histórica de colaboradores com a produção diária e gere a imagem geral para o grupo de gestores.</p>
      </div>
      <div class="nav-links">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./importar-producao.html">Importar produção</a>
        <a href="./historico-producao.html">Histórico</a>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <div>
          <label for="fData">Data de referência</label>
          <input type="date" id="fData" />
        </div>
        <div>
          <label for="fCoordenacao">Coordenação</label>
          <input type="text" id="fCoordenacao" placeholder="Opcional" />
        </div>
        <div>
          <label for="fSupervisao">Supervisão</label>
          <input type="text" id="fSupervisao" placeholder="Opcional" />
        </div>
        <div>
          <label for="fNome">Nome</label>
          <input type="text" id="fNome" placeholder="Opcional" />
        </div>
        <div style="display:flex;align-items:end;">
          <button id="btnPesquisar">Pesquisar</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" id="btnProcessar">Processar dia</button>
        <button id="btnGerarImagem">Gerar imagem geral</button>
      </div>

      <div class="summary">
        <div class="mini">
          <div class="label">Data</div>
          <div class="value" id="sumData">-</div>
        </div>
        <div class="mini">
          <div class="label">Total sem produção</div>
          <div class="value" id="sumTotal">0</div>
        </div>
        <div class="mini">
          <div class="label">Status</div>
          <div class="value" id="sumStatus">Aguardando</div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Colaborador</th>
              <th>Coordenação</th>
              <th>Supervisão</th>
              <th>Cargo</th>
              <th>Tipo</th>
              <th>Motivo</th>
            </tr>
          </thead>
          <tbody id="tbodyResultado"></tbody>
        </table>
      </div>

      <div class="meta" id="metaResultado">Aguardando processamento.</div>
    </div>

    <canvas id="canvasImagem" class="hidden"></canvas>
  </div>
  <script type="module" src="./js/efetivosSemProducao.js"></script>
</body>
</html>
