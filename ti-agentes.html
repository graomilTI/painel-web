<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TI · Agentes de Sincronização</title>
  <link rel="icon" href="./assets/icons/pwa-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./assets/css/ti-agentes-kpis.css?v=20260806-execucoes" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Painel</h2>
        <p>Gestão integrada</p>
      </div>
      <div id="sidebarMenu"></div>
    </aside>

    <div class="content-wrap">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">TI · Agentes de Sincronização</h1>
          <div class="meta" id="welcomeUser">Olá</div>
        </div>
        <div class="topbar-actions">
          <span class="badge" id="roleBadge">USUÁRIO</span>
          <button class="btn btn-secondary" id="signOutBtn" type="button">Sair</button>
        </div>
      </header>

      <main class="page-main" id="pageContent"></main>
    </div>
  </div>

  <!--
    Agentes mantém polling e consultas assíncronas próprias. Se o router fizer
    soft-nav para outra tela, essas rotinas continuam vivas e podem renderizar
    #pageContent novamente, sobrescrevendo a rota de destino. Ao sair desta
    página, usamos navegação completa para desmontar timers/listeners e evitar
    o retorno visual para Agentes.
  -->
  <script>
    (() => {
      document.addEventListener('click', (event) => {
        if (
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) return;

        const anchor = event.target.closest?.('a[href]');
        if (!anchor || (anchor.target && anchor.target !== '_self') || anchor.hasAttribute('download')) return;

        let url;
        try {
          url = new URL(anchor.href, window.location.href);
        } catch {
          return;
        }

        if (url.origin !== window.location.origin) return;
        if (url.href === window.location.href) return;

        // Mantém navegação por hash dentro da própria tela funcionando.
        if (url.pathname === window.location.pathname && url.search === window.location.search) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign(url.href);
      }, true);
    })();
  </script>
  <script type="module" src="./assets/js/ti-agentes.js?v=20260828-kpi-ourosafra"></script>
  <script type="module" src="./assets/js/ti-agentes-finalizar-os.js?v=20260817-regras-operacionais"></script>
  <script type="module" src="./assets/js/ti-agentes-filas-v2.js?v=20260819-v2-lanes"></script>
</body>
</html>
