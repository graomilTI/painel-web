<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<base href="/painel/">
<script type="module" src="/painel/js/auth.js"></script>
</head>
<body>

<h1>Dashboard</h1>

<button onclick="logout()">Sair</button>

<script type="module">
import { supabase } from "/painel/js/auth.js";

window.logout = async function () {
  localStorage.removeItem("last_page");
  await supabase.auth.signOut();
  window.location.href = "/painel/login.html";
};
</script>

<script>
localStorage.setItem("last_page", window.location.pathname);
</script>

</body>
</html>
