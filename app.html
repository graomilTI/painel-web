<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Redirecionando…</title>
  <meta name="robots" content="noindex"/>
</head>
<body>
  <noscript>
    <a href="/painel/login/">Abrir login do Painel</a>
  </noscript>

  <script>
    (function(){
      const isProd = (location.hostname === "grao1000.com.br" || location.hostname === "www.grao1000.com.br");
      let token = "", role = "";
      try {
        token = localStorage.getItem("g1000_token") || localStorage.getItem("G1000_TOKEN") || "";
        role = (localStorage.getItem("g1000_perfil") || localStorage.getItem("G1000_ROLE") || "gestor").toLowerCase();
      } catch(_) {}

      let target;
      if (token) {
        target = role === "adm"
          ? (isProd ? "/painel/adm/" : "adm/app.html")
          : role === "diretoria"
            ? (isProd ? "/painel/diretoria/" : "diretoria/app.html")
            : (isProd ? "/painel/gestor/" : "gestor/app.html");
      } else {
        target = isProd ? "/painel/login/" : "index.html";
      }
      location.replace(target);
    })();
  </script>
</body>
</html>
