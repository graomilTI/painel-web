<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando — Logística</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <p>Redirecionando para o módulo de Logística...</p>
  <script>
    (function () {
      var hash = String(window.location.hash || '').replace('#', '').toLowerCase();
      var routes = {
        finalizacao: 'logistica-finalizacao',
        classificadores: 'logistica-classificadores',
        conferencias: 'logistica-conferencias',
        exportacoes: 'logistica-exportacoes',
        relatorios: 'logistica-relatorios'
      };
      var target = routes[hash] || 'logistica-adm-os';
      var url = new URL('./' + target, window.location.href);
      window.location.replace(url.href);
    })();
  </script>
</body>
</html>
