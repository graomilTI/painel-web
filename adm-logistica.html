<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel</title>
  <link rel="icon" href="./assets/icons/pwa-192.png" />
  <link rel="stylesheet" href="./styles.css?v=logistica-20260707" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Painel</h2>
        <p>Gestão integrada</p>
      </div>
      <div id="sidebarMenu"></div>
    </aside>

    <div class="content-wrap">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Painel</h1>
          <div class="meta" id="welcomeUser">Olá</div>
        </div>
        <div class="topbar-actions">
          <span class="badge" id="roleBadge">USUÁRIO</span>
          <button class="btn btn-secondary" id="signOutBtn" type="button">Sair</button>
        </div>
      </header>

      <main class="page-main" id="pageContent">
        <section class="card mt-16">
          <div class="feedback">Carregando Painel de Logística...</div>
        </section>
      </main>
    </div>
  </div>

  <script>
    window.setTimeout(function () {
      var content = document.getElementById('pageContent');
      if (content && /Carregando Painel de Logística/.test(content.textContent || '')) {
        content.innerHTML = '<section class="card mt-16"><div class="log-empty">O carregamento demorou mais que o esperado. Abra a aba Console para ver o erro ou recarregue com Ctrl + F5.</div></section>';
      }
    }, 12000);
  </script>
  <script type="module" src="./assets/js/adm-logistica.js?v=logistica-20260707"></script>
</body>
</html>
