<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="../ui.css"/>
  <style>
    .wrap{padding:18px; height:100%; display:flex; flex-direction:column; gap:14px}
    .panel{
      background: rgba(0,0,0,.12);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
    }
    .head{
      display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;
    }
    .grow{flex:1; min-width:240px}
    .steps{display:flex; gap:8px; align-items:center}
    .stepbtn{
      width:38px; height:38px; border-radius:12px;
      display:inline-flex; align-items:center; justify-content:center;
      border:1px solid var(--line);
      background: rgba(0,0,0,.18);
      cursor:pointer;
      font-weight:900;
    }
    .stepbtn.active{background: rgba(16,185,129,.18); border-color: rgba(16,185,129,.45)}
    .actions{display:flex; gap:10px; align-items:center; margin-left:auto}
    .list{
      flex:1;
      min-height:280px;
      overflow:auto;
      padding:10px;
      border-radius:14px;
      background: rgba(0,0,0,.18);
      border:1px solid var(--line);
    }
    .rowItem{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px; border-radius:12px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.12);
      margin-bottom:10px;
    }
    .rowItem .left{display:flex; gap:10px; align-items:center}
    .pill{padding:6px 10px; border-radius:999px; border:1px solid var(--line); background: rgba(0,0,0,.12); font-size:12px; color:var(--muted)}
    .mini{font-size:12px; color:var(--muted)}
    .inputMini{max-width:240px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:flex-end">
      <a class="btn" href="app.html">Voltar</a>
    </div>
    <div class="panel">
      <div class="h1" style="font-size:22px">Programação</div>
      <div class="sub">Etapas A–E (salva silenciosamente ao avançar)</div>

      <div style="height:10px"></div>

      <div class="head">
        <div class="grow">
          <label>Data referência</label>
          <input id="dataRef" />
        </div>
        <div class="grow">
          <label>Supervisão</label>
          <select id="selSup">
            <option value="">Carregando…</option>
          </select>
        </div>

        <div class="actions">
          <button class="btn primary" id="btnContexto">Carregar contexto</button>
          <span class="badge" id="ctxBadge">Nenhum contexto carregado.</span>
        </div>
      </div>

      <div style="height:10px"></div>

      <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center">
        <div class="steps" id="steps">
          <div class="stepbtn active" data-step="A">A</div>
          <div class="stepbtn" data-step="B">B</div>
          <div class="stepbtn" data-step="C">C</div>
          <div class="stepbtn" data-step="D">D</div>
          <div class="stepbtn" data-step="E">E</div>
        </div>

        <div class="pill">Etapa: <span id="etapaAtual">A</span></div>

        <div style="margin-left:auto; display:flex; gap:10px; align-items:center">
</div>
      </div>
    </div>

    <div class="panel" style="display:flex; flex-direction:column; gap:10px; flex:1; overflow:hidden">
      <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap">
        <div>
          <div style="font-weight:900">Colaboradores do dia</div>
          <div class="mini">Marque e preencha por etapa. A cada avanço, salva no GS.</div>
        </div>
        <div style="margin-left:auto" class="inputMini">
          <label>Buscar</label>
          <input id="busca" placeholder="Buscar..." />
        </div>
      </div>

      <div class="list" id="lista">
        <div class="mini">Carregue o contexto para começar.</div>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
    <script src="../assets/js/auth_unificado.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/programacao.js"></script>
</body>
</html>
