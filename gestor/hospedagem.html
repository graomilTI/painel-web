<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospedagem — Avulsa</title>

  <!-- Base do Painel Web (tema escuro / botões / selects / fundo) -->
  <link rel="stylesheet" href="../assets/css/app.css" />
  <!-- CSS específico do módulo -->
  <link rel="stylesheet" href="../assets/css/hospedagem_avulsa.css" />
</head>

<body>
  <!-- O módulo renderiza tudo aqui dentro -->
  <div id="appMain"></div>

  <!-- CORE -->
  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/auth.js"></script>

  <!-- MÓDULO -->
  <script src="../assets/js/hospedagem.js"></script>

  <!-- BOOTSTRAP (chama o módulo) -->
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const view = document.getElementById("appMain"); // ✅ aqui

    if (!view) {
      console.error("Container #appMain não encontrado.");
      return;
    }

    if (!window.HOSPEDAGEM || typeof window.HOSPEDAGEM.openHome !== "function") {
      console.error("Módulo HOSPEDAGEM não carregado.");
      return;
    }

    window.HOSPEDAGEM.openHome(view, {
      onBack: () => {
        window.location.href = "app.html";
      }
    });
  });
  </script>
</body>
</html>
