<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>
<base href="/painel/">
</head>
<body>

<h2>Login</h2>

<input id="email" placeholder="Email"><br>
<input id="senha" type="password" placeholder="Senha"><br>
<button onclick="login()">Entrar</button>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

const supabase = createClient(
  "https://xyzpnuumdqhegxakkyws.supabase.co",
  "sb_publishable_YDjKfceWqANbNVMaHte2Kw_Dy4_i471"
);

const { data } = await supabase.auth.getSession();

if (data.session) {
  const lastPage = localStorage.getItem("last_page") || "/painel/dashboard.html";
  window.location.href = lastPage;
}

window.login = async function () {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password: senha,
  });

  if (error) {
    alert("Erro no login");
    return;
  }

  const lastPage = localStorage.getItem("last_page");
  window.location.href = lastPage || "/painel/dashboard.html";
};
</script>

</body>
</html>
