<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex, nofollow">
  <title>Cotação de hospedagem | Grão 1000</title>
  <link rel="icon" href="./assets/icons/pwa-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1220; --card: rgba(8,15,26,.9); --border: rgba(148,163,184,.18); --field: #0f1b2d;
      --green: #16a34a; --green-light: #34d399; --text: #e2e8f0; --muted: #94a3b8; --danger: #f87171; --radius: 16px;
    }
    html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    .app { min-height: 100dvh; max-width: 720px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; background: rgba(8,15,26,.96); }
    .logo { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg,#166534,#16a34a); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; flex-shrink: 0; }
    .topbar h1 { font-size: 16px; font-weight: 700; }
    .topbar p { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .body { padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    label.campo { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
    input[type=text], select, textarea { width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 16px; font-family: inherit; }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
    .campo.erro input, .campo.erro textarea, .grupo.erro, .quarto.erro { border-color: var(--danger); }
    .quarto.erro .nome strong { color: var(--danger); }
    .grupo { display: flex; flex-direction: column; gap: 8px; border: 1px solid transparent; border-radius: 10px; }
    .grupo > .rotulo { font-size: 14px; font-weight: 600; }
    .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
    .opcao { display: inline-flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--border); border-radius: 999px; padding: 10px 14px; font-size: 14px; cursor: pointer; user-select: none; }
    .opcao input { accent-color: var(--green); width: 16px; height: 16px; }
    .opcao:has(input:checked) { border-color: var(--green-light); background: rgba(22,163,74,.16); }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .duo-uf { grid-template-columns: 1fr 96px; }
    #gExtras .opcao { padding: 8px 12px; }
    .pedido { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .pedido dt { color: var(--muted); font-size: 12px; }
    .pedido dd { font-size: 15px; font-weight: 600; }
    .pedido .largo { grid-column: 1 / -1; }
    .quarto { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 12px 0; border-top: 1px solid var(--border); }
    .quarto:first-of-type { border-top: 0; }
    .quarto .nome strong { display: block; font-size: 15px; }
    .quarto .nome small { color: var(--muted); }
    .quarto .preco { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .quarto .preco input[type=text] { width: 160px; }
    .quarto.sem-valor input[type=text] { opacity: .35; }
    .total { background: rgba(22,163,74,.12); border: 1px solid rgba(52,211,153,.4); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
    .total strong { font-size: 18px; }
    .btn { border: 0; border-radius: 12px; padding: 14px 18px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:disabled { opacity: .5; cursor: wait; }
    .acoes { display: flex; gap: 10px; flex-wrap: wrap; }
    .acoes .btn-primary { flex: 1; }
    .msg { padding: 12px 14px; border-radius: 12px; font-size: 14px; }
    .msg.erro { background: rgba(248,113,113,.12); border: 1px solid var(--danger); color: #fecaca; }
    .msg.ok { background: rgba(22,163,74,.14); border: 1px solid var(--green); color: #bbf7d0; }
    .muted { color: var(--muted); font-size: 13px; }
    .centro { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .centro .grande { font-size: 42px; }
    .isca { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">G</div>
      <div><h1 id="titulo">Cotação de hospedagem</h1><p id="validade">Grão 1000</p></div>
    </header>
    <main class="body" id="raiz"><div class="centro"><p class="muted">Carregando cotação…</p></div></main>
  </div>
  <script type="module" src="./assets/js/cotacao-hotel.js?v=20261024-cotacao-hotel2"></script>
</body>
</html>
