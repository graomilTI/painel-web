<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel G1000</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --green: #166534;
      --green-light: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #020617;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .menu a {
      text-decoration: none;
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      display: block;
      transition: 0.2s;
    }

    .menu a:hover {
      background: var(--green);
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .header {
      font-size: 22px;
      margin-bottom: 20px;
    }

    /* CARDS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .card p {
      font-size: 26px;
      font-weight: bold;
      color: var(--green-light);
    }

    /* BOTÃO */
    .btn {
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: white;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      background: var(--green-light);
    }

    /* MOBILE */
    @media(max-width: 768px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">G1000 Painel</div>

    <div class="menu">
      <a href="#">Dashboard</a>
      <a href="#">Programação</a>
      <a href="#">Hospedagem</a>
      <a href="#">Compras</a>
      <a href="#">Relatórios</a>
      <a href="#">Configurações</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="header">Dashboard</div>

    <div class="grid">

      <div class="card">
        <h3>Colaboradores Ativos</h3>
        <p id="colab">0</p>
      </div>

      <div class="card">
        <h3>Produção Hoje</h3>
        <p id="prod">0</p>
      </div>

      <div class="card">
        <h3>Hospedagens</h3>
        <p id="hosp">0</p>
      </div>

      <div class="card">
        <h3>Compras Pendentes</h3>
        <p id="comp">0</p>
      </div>

    </div>

    <br><br>

    <div class="card">
      <h3>Ações rápidas</h3>
      <button class="btn">Nova Programação</button>
      <button class="btn">Nova Compra</button>
    </div>

  </div>

  <script>
    // SIMULAÇÃO DE DADOS (depois ligamos no Supabase)
    document.getElementById("colab").innerText = 124;
    document.getElementById("prod").innerText = 87;
    document.getElementById("hosp").innerText = 32;
    document.getElementById("comp").innerText = 9;
  </script>

</body>
</html>
