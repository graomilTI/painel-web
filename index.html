<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/favicon.ico">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Painel Web — Login</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
  <div class="container">
    <div class="loginCard">
      <div class="h1">Painel Web</div>
      <div class="hint">Login de Gestor (PIN) ou ADM (CPF).</div>

      <div class="row">
        <div class="field">
          <label>PIN (Gestor)</label>
          <input
            id="pin"
            placeholder="ex.: 1234"
            inputmode="numeric"
            autocomplete="one-time-code"
          />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>CPF (ADM) — opcional</label>
          <input
            id="cpf"
            placeholder="somente números"
            inputmode="numeric"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="row" style="margin-top:10px">
        <button class="btn" id="btnTest" type="button">
          Testar conexão
        </button>
        <button class="btn primary" id="btnEntrar" type="submit">
          Entrar
        </button>
      </div>

      <div id="status" class="status">Pronto.</div>

      <div class="footer">Grão 1000 • Painel Web</div>
    </div>
  </div>

  <!-- LOGIN = SOMENTE CONFIG + LOGIN -->
  <script src="assets/js/config.js?v=999"></script>
  <script src="assets/js/login.js?v=999"></script>
</body>
</html>
