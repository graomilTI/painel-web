name: Patch NHE live verification

on:
  push:
    paths:
      - '.github/workflows/patch-nhe-live-verification.yml'
      - 'scripts/patch-nhe-live-verification.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-nhe-live-verification.py
      - name: Validate syntax
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          node --check agentes-grm-sync/grm-sync-nhe.js
          grep -nE 'existeNheNoGrmAoVivo|SALVO_NAO_CONFIRMADO|OS_NAO_ABERTA|coordenacaoPorUf|NHE_SYNC_DAYS_BACK' agentes-grm-sync/grm-sync-lancar-nhe.js agentes-grm-sync/grm-sync-nhe.js
      - name: Commit fix
        run: |
          if git diff --quiet -- agentes-grm-sync/grm-sync-lancar-nhe.js agentes-grm-sync/grm-sync-nhe.js; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentes-grm-sync/grm-sync-lancar-nhe.js agentes-grm-sync/grm-sync-nhe.js
          git commit -m 'fix: verify NHE live and sync historical window'
          git push origin HEAD:main
