name: Apply NHE dedupe simple

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-nhe-dedupe-simple.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nhe-dedupe-cliente-ponto
          fetch-depth: 0

      - name: Deduplicar candidatos por cliente e embarque
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('agentes-grm-sync/grm-sync-lancar-nhe.js')
          s = p.read_text(encoding='utf-8')
          old = """    stats.candidatos = candidatos.length;
    log('SUCCESS', candidatos.length + ' candidato(s) elegível(is) para lançamento automático.');

    var totalCandidatos = candidatos.length;
"""
          new = """    // REGRA OPERACIONAL: o NHE/FOB é único por Cliente + ponto de embarque.
    // Duas O.S. irmãs podem chegar como PENDENTE no mesmo cálculo; sem esta
    // deduplicação ambas eram montadas como candidatas antes do primeiro Salvar.
    var gruposCandidatos = {};
    candidatos = candidatos.filter(function (cand) {
      var info = cand && cand.osCoord ? cand.osCoord : {};
      var clienteGrupo = normText((cand && cand.cliente) || info.cliente);
      var embarqueGrupo = normText(info.embarque || info.local);
      if (!clienteGrupo || !embarqueGrupo) return true;
      var chaveGrupo = clienteGrupo + '|embarque:' + embarqueGrupo;
      if (gruposCandidatos[chaveGrupo]) {
        log('INFO', 'O.S. ' + cand.os + ': não será lançada; mesma combinação Cliente + Embarque já representada pela O.S. ' + gruposCandidatos[chaveGrupo] + '.');
        return false;
      }
      gruposCandidatos[chaveGrupo] = cand.os;
      return true;
    });

    stats.candidatos = candidatos.length;
    log('SUCCESS', candidatos.length + ' grupo(s) único(s) Cliente + Embarque elegível(is) para lançamento automático.');

    var totalCandidatos = candidatos.length;
"""
          if old not in s:
              raise SystemExit('Marcador de candidatos não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar sintaxe
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -n "REGRA OPERACIONAL: o NHE/FOB é único" agentes-grm-sync/grm-sync-lancar-nhe.js

      - name: Commit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- agentes-grm-sync/grm-sync-lancar-nhe.js
          git commit -m 'fix(nhe): lançar uma vez por cliente e ponto'
          git push origin HEAD:fix/nhe-dedupe-cliente-ponto
