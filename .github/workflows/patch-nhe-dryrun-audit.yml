name: Patch NHE dry-run audit

on:
  push:
    paths:
      - '.github/workflows/patch-nhe-dryrun-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-nhe-dryrun-audit.py
      - name: Validate
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -nA4 "if (dryRun)" agentes-grm-sync/grm-sync-lancar-nhe.js | tail -n 6
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentes-grm-sync/grm-sync-lancar-nhe.js
          git commit -m 'fix: keep NHE dry-run out of real launch totals'
          git push origin HEAD:main
