name: Patch NHE manual dry-run

on:
  push:
    paths:
      - '.github/workflows/patch-nhe-manual-dryrun.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-nhe-manual-dryrun.py
      - name: Validate
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -nA35 "reaberta manualmente após DRY_RUN_OK" agentes-grm-sync/grm-sync-lancar-nhe.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentes-grm-sync/grm-sync-lancar-nhe.js
          git commit -m 'fix: allow explicit NHE launch after dry-run'
          git push origin HEAD:main
