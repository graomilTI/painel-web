name: Aplicar alojamentos multisupervisoes

on:
  push:
    branches:
      - agent/alojamento-multisupervisoes
    paths:
      - .github/workflows/apply-alojamento-multisupervisoes.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/alojamento-multisupervisoes' || github.ref_name == 'agent/alojamento-multisupervisoes'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: agent/alojamento-multisupervisoes
          fetch-depth: 0

      - name: Aplicar ajuste
        run: |
          git apply --recount --check .patches/alojamento-multisupervisoes.patch
          git apply --recount .patches/alojamento-multisupervisoes.patch

      - name: Validar JavaScript
        run: |
          node --check assets/js/adm-hotel-alojamentos-v2.js
          node --check assets/js/adm-hotel-alojamentos-v2-view.js
          node --check assets/js/hospedagem.js

      - name: Publicar alterações na branch
        run: |
          rm -f .patches/alojamento-multisupervisoes.patch
          rm -f .github/workflows/apply-alojamento-multisupervisoes.yml
          rmdir .patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(hospedagem): libera alojamento para várias supervisões [skip ci]"
          git push origin HEAD:agent/alojamento-multisupervisoes
