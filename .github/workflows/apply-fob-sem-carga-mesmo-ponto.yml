name: Aplicar regra FOB sem carga no mesmo ponto

on:
  push:
    paths:
      - 'scripts/apply_fob_sem_carga_mesmo_ponto.py'
      - '.github/workflows/apply-fob-sem-carga-mesmo-ponto.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python3 scripts/apply_fob_sem_carga_mesmo_ponto.py

      - name: Validar JavaScript
        run: |
          node --check assets/js/logistica-fob-page-v9.js
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js

      - name: Commitar alteração
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'grao1000-automation'
          git config user.email 'automation@grao1000.com.br'
          git add assets/js/logistica-fob-page-v9.js agentes-grm-sync/grm-sync-lancar-nhe.js logistica-fob.html
          git commit -m 'fix(fob): bloqueia lançamento quando há carga no mesmo ponto'
          git push origin HEAD:main
