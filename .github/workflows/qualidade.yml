name: Qualidade (lint, tipos, testes)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 roda os .ts das Edge Functions direto nos testes (type stripping).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agentes-grm-sync/package-lock.json
            email-worker/package-lock.json

      - name: Dependências (ferramental + agentes + email-worker)
        env:
          # Os testes só importam funções puras dos agentes; o Chromium não é necessário.
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          npm ci
          npm ci --prefix agentes-grm-sync --omit=dev
          npm ci --prefix email-worker --omit=dev

      - name: Lint (erros travam; avisos só informam)
        run: npm run lint

      - name: Checagem de tipos (arquivos com // @ts-check)
        run: npm run typecheck

      - name: Testes
        run: npm test
