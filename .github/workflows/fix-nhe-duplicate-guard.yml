name: Fix NHE historical duplicate guard

on:
  push:
    paths:
      - '.github/workflows/fix-nhe-duplicate-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: python3 scripts/fix-nhe-duplicate-guard.py

      - name: Validate syntax
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -nE 'existeNheReal|JA_EXISTIA_GRM|AUTO_CONTINUACAO' agentes-grm-sync/grm-sync-lancar-nhe.js

      - name: Commit fix
        run: |
          if git diff --quiet -- agentes-grm-sync/grm-sync-lancar-nhe.js; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentes-grm-sync/grm-sync-lancar-nhe.js
          git commit -m 'fix: block duplicate historical NHE launches'
          git push origin HEAD:main
