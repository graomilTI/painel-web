name: Patch NHE observacao aprovado gestor

on:
  push:
    branches:
      - 'fix/nhe-observacao-aprovado-gestor'
    paths:
      - '.github/workflows/patch-nhe-observacao-aprovado-gestor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/nhe-observacao-aprovado-gestor
          fetch-depth: 0

      - name: Trocar observacao fixa
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('agentes-grm-sync/grm-sync-lancar-nhe.js')
          text = path.read_text(encoding='utf-8')

          old = 'Lançado Admin'
          new = 'Aprovado pelo Gestor'
          count = text.count(old)
          if count < 2:
              raise SystemExit(f'Esperava ao menos 2 ocorrências de {old!r}, encontrei {count}.')

          text = text.replace(old, new)

          if old in text:
              raise SystemExit('Ainda existe a observação antiga no agente.')
          if "var OBS_FIXA = 'Aprovado pelo Gestor';" not in text:
              raise SystemExit('OBS_FIXA não foi atualizada corretamente.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar sintaxe e regra
        shell: bash
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -n "var OBS_FIXA = 'Aprovado pelo Gestor';" agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -n -A3 'function observacaoPara' agentes-grm-sync/grm-sync-lancar-nhe.js
          if grep -n 'Lançado Admin' agentes-grm-sync/grm-sync-lancar-nhe.js; then
            echo 'Observação antiga ainda presente.' >&2
            exit 1
          fi

      - name: Commit do ajuste
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- agentes-grm-sync/grm-sync-lancar-nhe.js
          git commit -m 'fix(nhe): usar observação Aprovado pelo Gestor'
          git push origin HEAD:fix/nhe-observacao-aprovado-gestor
