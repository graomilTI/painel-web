name: Patch NHE existing movement

on:
  push:
    paths:
      - '.github/workflows/patch-nhe-existing-movement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-nhe-existing-movement.py
      - name: Validate
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -nE 'existeMovimentoReal|JA_EXISTIA_MOVIMENTO_GRM|GRM_JA_POSSUI_MOVIMENTO' agentes-grm-sync/grm-sync-lancar-nhe.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentes-grm-sync/grm-sync-lancar-nhe.js
          git commit -m 'fix: block NHE when GRM day movement already exists'
          git push origin HEAD:main

