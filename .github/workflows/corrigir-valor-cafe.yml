name: Corrigir valor do café

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-valor-cafe.yml

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar correção
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arquivo = Path('assets/js/financeiro.js')
          codigo = arquivo.read_text(encoding='utf-8-sig')

          constante_antiga = "const PAGAMENTO_VALOR_ALMOCO = 30;"
          constante_nova = """const PAGAMENTO_VALOR_REFEICAO = Object.freeze({
            CAFE: 15,
            ALMOCO: 30,
            JANTA: 30
          });"""

          calculo_antigo = "    const valor = PAGAMENTO_VALOR_ALMOCO;"
          calculo_novo = "    const valor = PAGAMENTO_VALOR_REFEICAO[String(row.tipo_beneficio || '').toUpperCase()] ?? PAGAMENTO_VALOR_REFEICAO.ALMOCO;"

          if codigo.count(constante_antiga) != 1:
              raise SystemExit(f'Esperava 1 constante antiga, encontrei {codigo.count(constante_antiga)}.')
          if codigo.count(calculo_antigo) != 1:
              raise SystemExit(f'Esperava 1 cálculo antigo, encontrei {codigo.count(calculo_antigo)}.')

          codigo = codigo.replace(constante_antiga, constante_nova, 1)
          codigo = codigo.replace(calculo_antigo, calculo_novo, 1)

          if 'CAFE: 15' not in codigo:
              raise SystemExit('A regra do café não foi aplicada.')
          if 'PAGAMENTO_VALOR_ALMOCO' in codigo:
              raise SystemExit('A constante antiga ainda está presente.')

          arquivo.write_text('\ufeff' + codigo, encoding='utf-8')
          PY

          rm -f .github/workflows/corrigir-valor-cafe.yml

      - name: Publicar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/financeiro.js .github/workflows/corrigir-valor-cafe.yml
          git commit -m "Corrige valor do café para R$ 15"
          git push origin main
