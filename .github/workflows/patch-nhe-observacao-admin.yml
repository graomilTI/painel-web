name: Patch NHE observacao admin

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-nhe-observacao-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar observacao fixa Lançado Admin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('agentes-grm-sync/grm-sync-lancar-nhe.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  ' *   - Obs. fixa escolhida pelo usuário: "Lançado via Bot".',
                  ' *   - Obs. fixa escolhida pelo usuário: "Lançado Admin".'
              ),
              (
                  "var OBS_FIXA = process.env.NHE_LANCAMENTO_OBS || 'Lançado via Bot';",
                  "var OBS_FIXA = 'Lançado Admin';"
              ),
              (
                  "function observacaoPara(candidato) {\n  if (!candidato.viaGestor) return OBS_FIXA;\n  var km = (candidato.loginMatch.distancia / 1000).toFixed(1);\n  return 'Lançamento BOT - ' + km + 'km de distancia';\n}",
                  "function observacaoPara(candidato) {\n  return OBS_FIXA;\n}"
              ),
              (
                  "        // no nome do gestor da regional (pedido do usuário 21/07), com Obs.\n        // indicando a distância. Só cai pro comportamento antigo (fica",
                  "        // no nome do gestor da regional (pedido do usuário 21/07), mantendo a\n        // observação fixa 'Lançado Admin'. Só cai pro comportamento antigo (fica"
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Trecho esperado não encontrado para substituição: {old[:100]!r}')
              text = text.replace(old, new, 1)

          if 'Lançado via Bot' in text:
              raise SystemExit('Ainda existe ocorrência de Lançado via Bot no agente.')
          if 'Lançamento BOT - ' in text:
              raise SystemExit('Ainda existe observação dinâmica Lançamento BOT no agente.')
          if "var OBS_FIXA = 'Lançado Admin';" not in text:
              raise SystemExit('OBS_FIXA não ficou travada como Lançado Admin.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar sintaxe e regra
        shell: bash
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -n "var OBS_FIXA = 'Lançado Admin';" agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -n -A3 'function observacaoPara' agentes-grm-sync/grm-sync-lancar-nhe.js
          if grep -nE 'Lançado via Bot|Lançamento BOT - ' agentes-grm-sync/grm-sync-lancar-nhe.js; then
            echo 'Observação antiga ainda presente.' >&2
            exit 1
          fi

      - name: Commit do ajuste
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentes-grm-sync/grm-sync-lancar-nhe.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix(nhe): usar observação Lançado Admin'
          git push origin HEAD:main
