name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check email-worker/worker.js
          node --check assets/js/adm-compras.js
          node --check assets/js/compras.js
          node --check assets/js/patrimonios.js
          node --check assets/js/programacao.js
          node --check assets/js/authGuard.js
          node --check assets/js/conferencia-bonus-caixa.js
          node --check agentes-grm-sync/grm-sync-bonus-caixa.js
          node --check agentes-grm-sync/worker/grm-sync-job-worker.js

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          mkdir /tmp/deploy
          cp -r . /tmp/deploy/
          rm -rf /tmp/deploy/.git

          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/deploy/. .

          # Sinal de versão que muda em TODO deploy (SHA do commit). O painel
          # faz poll deste arquivo e avisa o usuário quando há versão nova, sem
          # depender de bump manual de ?v= em cada arquivo.
          printf '{"version":"%s","deployedAt":"%s"}\n' "${GITHUB_SHA}" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > version.json

          git add -A
          git commit -m "Deploy $(date '+%Y-%m-%d %H:%M:%S')" --allow-empty
          git push origin gh-pages --force
