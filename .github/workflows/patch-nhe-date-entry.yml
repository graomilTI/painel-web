name: Patch NHE date entry

on:
  push:
    paths:
      - '.github/workflows/patch-nhe-date-entry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch recovery flag
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('agentes-grm-sync/grm-sync-lancar-nhe.js')
          s = p.read_text(encoding='utf-8')
          old = "var AUTO_CONTINUACAO = String(process.env.NHE_LANCAMENTO_AUTO_CONTINUACAO || 'true').toLowerCase() !== 'false';"
          new = old + "\n// Uso manual na recuperação: revalida auditorias SUCESSO contra o GRM real.\nvar REVALIDAR_SUCESSO = String(process.env.NHE_LANCAMENTO_REVALIDAR_SUCESSO || 'false').toLowerCase() === 'true';"
          if s.count(old) != 1:
              raise SystemExit('flag base nao encontrada uma vez')
          s = s.replace(old, new, 1)
          old2 = """  var result = await supabase
    .from(TABLE_RESULTADOS)
    .select('data_referencia,numero_os,cliente,supervisao,funcionario,status,raw')
    .gte('data_referencia', ymd(inicio))
    .lt('data_referencia', dataReferencia)
    .in('status', ['SEM_LOGIN', 'SEM_COORDENADA_OS', 'FORA_DO_RAIO', 'ERRO', 'SEM_FUNCIONARIO'])
    .order('data_referencia', { ascending: true });"""
          new2 = """  var statusesHistoricos = ['SEM_LOGIN', 'SEM_COORDENADA_OS', 'FORA_DO_RAIO', 'ERRO', 'SEM_FUNCIONARIO'];
  if (REVALIDAR_SUCESSO) statusesHistoricos.push('SUCESSO');
  var result = await supabase
    .from(TABLE_RESULTADOS)
    .select('data_referencia,numero_os,cliente,supervisao,funcionario,status,raw')
    .gte('data_referencia', ymd(inicio))
    .lt('data_referencia', dataReferencia)
    .in('status', statusesHistoricos)
    .order('data_referencia', { ascending: true });"""
          if s.count(old2) != 1:
              raise SystemExit('consulta historica nao encontrada uma vez')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -nE 'REVALIDAR_SUCESSO|statusesHistoricos' agentes-grm-sync/grm-sync-lancar-nhe.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentes-grm-sync/grm-sync-lancar-nhe.js
          git commit -m 'fix: allow manual revalidation of historical NHE success'
          git push origin HEAD:main
