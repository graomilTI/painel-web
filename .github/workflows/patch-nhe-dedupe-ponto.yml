name: Patch NHE dedupe cliente ponto

on:
  push:
    branches:
      - 'fix/nhe-dedupe-cliente-ponto'
    paths:
      - '.github/workflows/patch-nhe-dedupe-ponto.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nhe-dedupe-cliente-ponto
          fetch-depth: 0

      - name: Aplicar trava cliente mais ponto
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('agentes-grm-sync/grm-sync-lancar-nhe.js')
          text = path.read_text(encoding='utf-8')

          old = """async function carregarJaLancadas(dataReferencia) {
  var inicio = new Date(dataReferencia + 'T12:00:00');
  inicio.setDate(inicio.getDate() - REPROCESSAR_DIAS);
  var statusesResolvidos = ['JA_EXISTIA_GRM', 'JA_EXISTIA_MOVIMENTO_GRM'];
"""
          new = """async function carregarJaLancadas(dataReferencia) {
  var inicio = new Date(dataReferencia + 'T12:00:00');
  inicio.setDate(inicio.getDate() - REPROCESSAR_DIAS);
  var statusesResolvidos = ['JA_EXISTIA_GRM', 'JA_EXISTIA_GRUPO_GRM', 'JA_EXISTIA_MOVIMENTO_GRM', 'MESMO_PONTO_AGRUPADO'];
"""
          if old not in text: raise SystemExit('Trecho carregarJaLancadas não encontrado')
          text = text.replace(old, new, 1)

          marker = """function observacaoPara(candidato) {
  return OBS_FIXA;
}
"""
          insert = """function chaveGrupoEmbarque(candidato) {
  var info = candidato && candidato.osCoord ? candidato.osCoord : {};
  var cliente = normText((candidato && candidato.cliente) || info.cliente);
  var embarque = normText(info.embarque || info.local);
  return cliente && embarque ? cliente + '|embarque:' + embarque : '';
}

function identidadeGrupoEmbarque(candidato) {
  var info = candidato && candidato.osCoord ? candidato.osCoord : {};
  var embarque = String(info.embarque || '').trim();
  var match = embarque.match(/^(.*?)\\s*\\((.*)\\)\\s*$/);
  var cidade = match ? match[1].trim() : '';
  var ponto = match ? match[2].trim() : String(info.local || '').split('·')[0].trim();
  return {
    cliente: String((candidato && candidato.cliente) || info.cliente || '').trim(),
    cidade: cidade,
    ponto: ponto
  };
}

function observacaoPara(candidato) {
  return OBS_FIXA;
}
"""
          if marker not in text: raise SystemExit('Marcador observacaoPara não encontrado')
          text = text.replace(marker, insert, 1)

          live_marker = """async function preencherEModalNhe(page, candidato, dryRun, debug) {
"""
          live_fn = """// Trava de grupo ao vivo: uma NHE cobre todas as O.S. do MESMO Cliente +
// ponto de embarque na data. Evita que duas O.S. irmãs, candidatas no mesmo
// lote (ou em execuções consecutivas antes do sync), recebam NHE duplicada.
async function existeNheMesmoPontoNoGrmAoVivo(page, candidato) {
  var dataBr = brDate(candidato.data);
  var identidade = identidadeGrupoEmbarque(candidato);
  return page.evaluate(async function (payload) {
    function norm(value) {
      return String(value == null ? '' : value)
        .normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')
        .replace(/\\u00A0/g, ' ').replace(/\\s+/g, ' ').trim().toUpperCase();
    }
    var token = '';
    for (var i = 0; i < localStorage.length; i++) {
      try {
        var value = JSON.parse(localStorage.getItem(localStorage.key(i)));
        if (value && value.userToken) token = value.userToken;
      } catch (_) {}
    }
    if (!token) throw new Error('Token do GRM não encontrado para confirmar grupo NHE.');
    var response = await fetch('/api/reports/classification/nhe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ lnsDateFrom: payload.dataBr, lnsDateTo: payload.dataBr })
    });
    var json = await response.json();
    if (!response.ok || json.result === false) {
      throw new Error('Consulta NHE GRM por grupo falhou: ' + JSON.stringify(json).slice(0, 500));
    }
    var cliente = norm(payload.identidade.cliente);
    var cidade = norm(payload.identidade.cidade);
    var ponto = norm(payload.identidade.ponto);
    var rows = json.searchData || [];
    var found = rows.find(function (row) {
      if (norm(row.cliName) !== cliente) return false;
      if (ponto && norm(row.splName) !== ponto) return false;
      if (cidade && norm(row.citEmb) !== cidade) return false;
      return true;
    });
    return found ? {
      existe: true,
      os: String(found.sorCode == null ? '' : found.sorCode),
      cliente: String(found.cliName || ''),
      ponto: String(found.splName || ''),
      cidade: String(found.citEmb || '')
    } : { existe: false };
  }, { dataBr: dataBr, identidade: identidade });
}

async function preencherEModalNhe(page, candidato, dryRun, debug) {
"""
          if live_marker not in text: raise SystemExit('Marcador preencherEModalNhe não encontrado')
          text = text.replace(live_marker, live_fn, 1)

          old_stats = """var stats = { pendentes: 0, candidatos: 0, sucesso: 0, erro: 0, semLogin: 0, semFuncionario: 0, foraDoRaio: 0, semCoordenadaOs: 0, semServico: 0, viaGestor: 0, jaExistiaGrm: 0, jaExistiaMovimento: 0, osNaoAberta: 0, salvoNaoConfirmado: 0 };"""
          new_stats = """var stats = { pendentes: 0, candidatos: 0, sucesso: 0, erro: 0, semLogin: 0, semFuncionario: 0, foraDoRaio: 0, semCoordenadaOs: 0, semServico: 0, viaGestor: 0, jaExistiaGrm: 0, jaExistiaMovimento: 0, osNaoAberta: 0, salvoNaoConfirmado: 0, mesmoPontoAgrupado: 0, nheMesmoPontoGrm: 0 };"""
          if old_stats not in text: raise SystemExit('Stats não encontrado')
          text = text.replace(old_stats, new_stats, 1)

          candidate_marker = """    stats.candidatos = candidatos.length;
    log('SUCCESS', candidatos.length + ' candidato(s) elegível(is) para lançamento automático.');
"""
          candidate_new = """    // Uma única candidata por Cliente + ponto de embarque. Sem esta trava,
    // duas O.S. irmãs que chegam PENDENTE no mesmo cálculo são montadas antes
    // do primeiro Salvar e ambas poderiam ser lançadas na mesma execução.
    var gruposCandidatos = {};
    var candidatosUnicos = [];
    for (var u = 0; u < candidatos.length; u++) {
      var cand = candidatos[u];
      var chaveGrupo = chaveGrupoEmbarque(cand);
      if (chaveGrupo && gruposCandidatos[chaveGrupo]) {
        stats.mesmoPontoAgrupado++;
        await salvarResultado(cand, {
          status: 'MESMO_PONTO_AGRUPADO',
          lancado_em: null,
          erro: null,
          raw: {
            agrupado_com_os: gruposCandidatos[chaveGrupo],
            regra: 'MESMO_CLIENTE_MESMO_PONTO_UMA_NHE'
          }
        });
        log('INFO', 'O.S. ' + cand.os + ': agrupada com O.S. ' + gruposCandidatos[chaveGrupo] + ' (mesmo cliente + ponto); não será lançada neste lote.');
        continue;
      }
      if (chaveGrupo) gruposCandidatos[chaveGrupo] = cand.os;
      candidatosUnicos.push(cand);
    }
    candidatos = candidatosUnicos;

    stats.candidatos = candidatos.length;
    log('SUCCESS', candidatos.length + ' grupo(s) elegível(is) para lançamento automático; ' + stats.mesmoPontoAgrupado + ' O.S. irmã(s) agrupada(s).');
"""
          if candidate_marker not in text: raise SystemExit('Marcador candidatos não encontrado')
          text = text.replace(candidate_marker, candidate_new, 1)

          old_live = """            if (!dryRun && await existeNheNoGrmAoVivo(page, candidato.data, candidato.os)) {
              stats.jaExistiaGrm++;
              await salvarResultado(candidato, {
                status: 'JA_EXISTIA_GRM',
                lancado_em: null,
                raw: { origem_verificacao: 'grm_api_ao_vivo', nao_lancado_nesta_execucao: true }
              });
              log('INFO', 'O.S. ' + candidato.os + ' em ' + candidato.data + ': NHE já existe no GRM (consulta ao vivo); lançamento bloqueado.');
              continue;
            }
"""
          new_live = """            if (!dryRun) {
              var nheGrupoAoVivo = await existeNheMesmoPontoNoGrmAoVivo(page, candidato);
              if (nheGrupoAoVivo && nheGrupoAoVivo.existe) {
                stats.jaExistiaGrm++;
                if (String(nheGrupoAoVivo.os) !== String(candidato.os)) stats.nheMesmoPontoGrm++;
                var statusExistente = String(nheGrupoAoVivo.os) === String(candidato.os) ? 'JA_EXISTIA_GRM' : 'JA_EXISTIA_GRUPO_GRM';
                await salvarResultado(candidato, {
                  status: statusExistente,
                  lancado_em: null,
                  raw: {
                    origem_verificacao: 'grm_api_ao_vivo_cliente_ponto',
                    nao_lancado_nesta_execucao: true,
                    os_nhe_existente: nheGrupoAoVivo.os,
                    ponto_nhe_existente: nheGrupoAoVivo.ponto,
                    cidade_nhe_existente: nheGrupoAoVivo.cidade
                  }
                });
                log('INFO', 'O.S. ' + candidato.os + ' em ' + candidato.data + ': já existe NHE no mesmo cliente+ponto na O.S. ' + nheGrupoAoVivo.os + '; novo lançamento bloqueado.');
                continue;
              }
            }
"""
          if old_live not in text: raise SystemExit('Trava ao vivo antiga não encontrada')
          text = text.replace(old_live, new_live, 1)

          export_marker = """  existeNheReal: existeNheReal,
  existeMovimentoReal: existeMovimentoReal
};
"""
          export_new = """  existeNheReal: existeNheReal,
  existeMovimentoReal: existeMovimentoReal,
  chaveGrupoEmbarque: chaveGrupoEmbarque,
  identidadeGrupoEmbarque: identidadeGrupoEmbarque
};
"""
          if export_marker not in text: raise SystemExit('Exports não encontrados')
          text = text.replace(export_marker, export_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          node --check agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -n "MESMO_CLIENTE_MESMO_PONTO_UMA_NHE" agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -n "existeNheMesmoPontoNoGrmAoVivo" agentes-grm-sync/grm-sync-lancar-nhe.js
          grep -n "JA_EXISTIA_GRUPO_GRM" agentes-grm-sync/grm-sync-lancar-nhe.js

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- agentes-grm-sync/grm-sync-lancar-nhe.js
          git commit -m 'fix(nhe): deduplicar por cliente e ponto de embarque'
          git push origin HEAD:fix/nhe-dedupe-cliente-ponto
