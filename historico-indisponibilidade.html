<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histórico de Indisponibilidade</title>
  <style>
    :root{--bg:#07152f;--panel:#0b1d3d;--border:#16325f;--text:#e5e7eb;--muted:#9fb1d1}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#07152f 0%,#091a38 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{max-width:1280px;margin:32px auto;padding:0 20px}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    h1{margin:0 0 8px;font-size:34px}.subtitle{margin:0;color:var(--muted)}
    .nav-links{display:flex;gap:10px;flex-wrap:wrap}
    .nav-links a{color:var(--text);text-decoration:none;border:1px solid var(--border);background:rgba(255,255,255,.03);padding:10px 14px;border-radius:12px}
    .card{background:rgba(10,26,58,.96);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.18);margin-bottom:20px}
    .filters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
    label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px;font-weight:700}
    input,select,button{width:100%;padding:12px 14px;background:#0a1732;color:var(--text);border:1px solid var(--border);border-radius:12px;font:inherit}
    button{cursor:pointer;background:#13294f;font-weight:700}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:16px}
    table{width:100%;border-collapse:collapse;min-width:1100px;background:#09152b}
    th,td{padding:12px;border-bottom:1px solid #14305a;text-align:left;vertical-align:top}
    th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
    .meta{color:var(--muted);font-size:13px;margin-top:10px}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#12305b;border:1px solid var(--border);font-size:12px}
    @media (max-width:980px){.filters{grid-template-columns:1fr}h1{font-size:28px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Histórico de Indisponibilidade</h1>
        <p class="subtitle">Consulte e filtre férias, atestados e outros registros de indisponibilidade lançados pelo RH.</p>
      </div>
      <div class="nav-links">
        <a href="./dashboard">Dashboard</a>
        <a href="./ferias-atestados.html">Novo registro</a>
        <a href="./efetivos-sem-producao.html">Efetivos sem produção</a>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <div>
          <label for="fNome">Colaborador</label>
          <input type="text" id="fNome" placeholder="Nome" />
        </div>
        <div>
          <label for="fMotivo">Motivo</label>
          <select id="fMotivo">
            <option value="">Todos</option>
            <option value="Férias">Férias</option>
            <option value="Atestado">Atestado</option>
            <option value="Folga">Folga</option>
            <option value="Afastamento">Afastamento</option>
            <option value="Licença">Licença</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div>
          <label for="fInicio">Data inicial</label>
          <input type="date" id="fInicio" />
        </div>
        <div>
          <label for="fFim">Data final</label>
          <input type="date" id="fFim" />
        </div>
        <div style="display:flex;align-items:end;">
          <button id="btnPesquisar">Pesquisar</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Colaborador</th>
              <th>CPF</th>
              <th>Início</th>
              <th>Fim</th>
              <th>Motivo</th>
              <th>Observações</th>
              <th>Criado em</th>
              <th>Criado por</th>
            </tr>
          </thead>
          <tbody id="tbodyHistorico"></tbody>
        </table>
      </div>

      <div class="meta" id="metaHistorico">Carregando histórico...</div>
    </div>
  </div>

  <script type="module" src="./js/historicoIndisponibilidade.js"></script>
</body>
</html>
